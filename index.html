<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="page_404">
    <div class="container">
      <!-- 404 文字與純 CSS/SVG 動畫插圖 -->
      <div class="four_zero_four_bg">
        <h1>404</h1>
        <div class="astronaut-icon">
          <!-- 開源免費可商用 SVG 幽靈/太空人圖案 -->
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 6C20.954 6 12 14.954 12 26V52L22 46L32 52L42 46L52 52V26C52 14.954 43.046 6 32 6Z" fill="#39ac31"/>
            <circle cx="26" cy="24" r="4" fill="#ffffff"/>
            <circle cx="38" cy="24" r="4" fill="#ffffff"/>
            <path d="M28 34C29.5 36 34.5 36 36 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- 內容說明與按鈕區 -->
      <div class="content_box_404">
        <h3>Look like you're lost</h3>
        <p>The page you are looking for is not available!</p>
        <a href="/" class="link_404">Go to Home</a>
      </div>
    </div>
  </section>
</body>
</html>
